[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly install the runtime for Git-triggered builds as well as CLI deploys.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Do not use a static export: /api/plan requires a server function.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
